name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  discipline-bot:
    name: Discipline bot — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: crypto-discipline-bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: crypto-discipline-bot
        env:
          BOT_TOKEN: dummy
          DATABASE_URL: postgresql+asyncpg://x:x@localhost/x
          ALEMBIC_DATABASE_URL: postgresql+psycopg2://x:x@localhost/x
        run: pytest -q
